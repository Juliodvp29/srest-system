<div class="mb-10 text-center lg:text-left">
  <h2 class="text-slate-900 dark:text-white/90 text-4xl font-black leading-tight tracking-tight">
    Nueva Contraseña
  </h2>
  <p class="text-sage dark:text-sage/90 text-base font-normal mt-2">
    Ingresa tu nueva contraseña para acceder a tu cuenta.
  </p>
</div>

@if (success()) {
  <div class="space-y-6">
    <div
      class="p-4 rounded-lg bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-400 border border-green-200 dark:border-green-800 text-sm"
    >
      Contraseña actualizada con éxito. Serás redirigido al inicio de sesión en unos segundos...
    </div>
    <div class="text-center">
      <a
        routerLink="/auth/login"
        class="text-slate-900 dark:text-primary font-bold hover:underline"
      >
        Ir al inicio de sesión
      </a>
    </div>
  </div>
} @else {
  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="flex flex-col w-full">
      <label class="flex flex-col w-full">
        <p class="text-slate-900 dark:text-white/80 text-sm font-semibold leading-normal pb-2">
          Nueva Contraseña
        </p>
        <div class="relative">
          <input
            formControlName="password"
            class="flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/40 border border-slate-200 dark:border-white/5 bg-white dark:bg-white/5 h-14 placeholder:text-sage/30 px-4 text-base font-normal transition-all"
            placeholder="••••••••"
            type="password"
            [class.border-red-400]="
              resetForm.get('password')?.invalid && resetForm.get('password')?.touched
            "
          />
        </div>
        @if (resetForm.get('password')?.invalid && resetForm.get('password')?.touched) {
          <p class="text-red-400 dark:text-red-400/80 text-xs mt-1 italic">
            La contraseña debe tener al menos 6 caracteres.
          </p>
        }
      </label>
    </div>

    <div class="flex flex-col w-full">
      <label class="flex flex-col w-full">
        <p class="text-slate-900 dark:text-white/80 text-sm font-semibold leading-normal pb-2">
          Confirmar Contraseña
        </p>
        <div class="relative">
          <input
            formControlName="confirmPassword"
            class="flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/40 border border-slate-200 dark:border-white/5 bg-white dark:bg-white/5 h-14 placeholder:text-sage/30 px-4 text-base font-normal transition-all"
            placeholder="••••••••"
            type="password"
            [class.border-red-400]="
              resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched
            "
          />
        </div>
        @if (resetForm.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched) {
          <p class="text-red-400 dark:text-red-400/80 text-xs mt-1 italic">
            Las contraseñas no coinciden.
          </p>
        }
      </label>
    </div>

    @if (error()) {
      <div
        class="p-4 rounded-lg bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400 border border-red-200 dark:border-red-800 text-sm"
      >
        {{ error() }}
      </div>
    }

    <div class="pt-2">
      <button
        class="w-full flex min-h-[56px] cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary text-background-dark text-base font-bold leading-normal tracking-wide hover:bg-primary/90 transition-colors shadow-lg shadow-primary/10 disabled:opacity-50 disabled:cursor-not-allowed"
        type="submit"
        [disabled]="isLoading() || (resetForm.invalid && resetForm.touched)"
      >
        @if (isLoading()) {
          Actualizando...
        } @else {
          Actualizar Contraseña
        }
      </button>
    </div>
  </form>
}
