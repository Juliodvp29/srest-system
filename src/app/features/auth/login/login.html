<!-- Header Component Style -->
<div class="mb-10 text-center lg:text-left">
  <div class="lg:hidden flex justify-center mb-6">
    <div class="size-10 text-primary">
      <svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path
          clip-rule="evenodd"
          d="M24 18.4228L42 11.475V34.3663C42 34.7796 41.7457 35.1504 41.3601 35.2992L24 42V18.4228Z"
          fill="currentColor"
          fill-rule="evenodd"
        ></path>
        <path
          clip-rule="evenodd"
          d="M24 8.18819L33.4123 11.574L24 15.2071L14.5877 11.574L24 8.18819ZM9 15.8487L21 20.4805V37.6263L9 32.9945V15.8487ZM27 37.6263V20.4805L39 15.8487V32.9945L27 37.6263ZM25.354 2.29885C24.4788 1.98402 23.5212 1.98402 22.646 2.29885L4.98454 8.65208C3.7939 9.08038 3 10.2097 3 11.475V34.3663C3 36.0196 4.01719 37.5026 5.55962 38.098L22.9197 44.7987C23.6149 45.0671 24.3851 45.0671 25.0803 44.7987L42.4404 38.098C43.9828 37.5026 45 36.0196 45 34.3663V11.475C45 10.2097 44.2061 9.08038 43.0155 8.65208L25.354 2.29885Z"
          fill="currentColor"
          fill-rule="evenodd"
        ></path>
      </svg>
    </div>
  </div>
  <h2 class="text-slate-900 dark:text-white/90 text-4xl font-black leading-tight tracking-tight">
    Bienvenido de nuevo
  </h2>
  <p class="text-sage dark:text-sage/90 text-base font-normal mt-2">
    Ingresa tus credenciales para acceder al sistema
  </p>
</div>

<!-- Form -->
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
  <!-- Email TextField -->
  <div class="flex flex-col w-full">
    <label class="flex flex-col w-full">
      <p class="text-slate-900 dark:text-white/80 text-sm font-semibold leading-normal pb-2">
        Correo electrónico
      </p>
      <div class="relative">
        <input
          formControlName="email"
          class="flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/40 border border-slate-200 dark:border-white/5 bg-white dark:bg-white/5 h-14 placeholder:text-sage/30 px-4 text-base font-normal transition-all"
          placeholder="ejemplo@restaurante.com"
          type="email"
        />
      </div>
      @if (loginForm.controls.email.invalid && loginForm.controls.email.touched) {
        <p class="text-red-400 dark:text-red-400/80 text-xs mt-1 italic">
          Por favor ingresa un correo válido.
        </p>
      }
    </label>
  </div>

  <!-- Password TextField -->
  <div class="flex flex-col w-full">
    <label class="flex flex-col w-full">
      <div class="flex justify-between items-center pb-2">
        <p class="text-slate-900 dark:text-white/80 text-sm font-semibold leading-normal">
          Contraseña
        </p>
        <a class="text-sage dark:text-primary/90 text-xs font-medium hover:underline" href="#"
          >¿Olvidaste tu contraseña?</a
        >
      </div>
      <div class="relative">
        <input
          formControlName="password"
          class="flex w-full rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/40 border border-slate-200 dark:border-white/5 bg-white dark:bg-white/5 h-14 placeholder:text-sage/30 px-4 text-base font-normal transition-all"
          placeholder="••••••••"
          type="password"
        />
      </div>
      @if (loginForm.controls.password.invalid && loginForm.controls.password.touched) {
        <p class="text-red-400 dark:text-red-400/80 text-xs mt-1 italic">
          La contraseña es requerida (mín. 6 caracteres).
        </p>
      }
    </label>
  </div>

  <!-- Submit Button -->
  <div class="pt-2">
    <button
      class="w-full flex min-h-[56px] cursor-pointer items-center justify-center overflow-hidden rounded-lg bg-primary text-background-dark text-base font-bold leading-normal tracking-wide hover:bg-primary/90 transition-colors shadow-lg shadow-primary/10 disabled:opacity-50 disabled:cursor-not-allowed"
      type="submit"
      [disabled]="loginForm.invalid && loginForm.touched"
    >
      Iniciar Sesión
    </button>
  </div>
</form>

<!-- Footer Links -->
<div class="mt-10 pt-6 border-t border-solid border-slate-100 dark:border-white/5 text-center">
  <p class="text-sage dark:text-sage/80 text-sm">
    ¿No tienes una cuenta?
    <a
      class="text-slate-900 dark:text-primary font-bold hover:underline ml-1"
      routerLink="/customer/register"
      >Crear cuenta</a
    >
  </p>
</div>

<!-- Bottom Decoration/Info -->
<div class="mt-8 flex justify-center gap-6">
  <div class="flex items-center gap-1 text-xs text-sage/50 dark:text-sage/30">
    <span class="material-symbols-outlined text-[16px]">verified_user</span>
    <span>Acceso seguro</span>
  </div>
  <div class="flex items-center gap-1 text-xs text-sage/50 dark:text-sage/30">
    <span class="material-symbols-outlined text-[16px]">public</span>
    <span>v2.4.0</span>
  </div>
</div>
