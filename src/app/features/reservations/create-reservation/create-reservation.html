<div class="h-full flex flex-col bg-slate-50 dark:bg-slate-900 overflow-hidden">
    <!-- Header -->
    <header
        class="p-6 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm z-10 sticky top-0">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div>
                <a routerLink="/reservations"
                    class="text-sm text-slate-500 hover:text-slate-900 dark:hover:text-white mb-1 inline-flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">arrow_back</span>
                    Volver a Reservas
                </a>
                <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">
                    Nueva Reserva
                </h1>
            </div>
        </div>
    </header>

    <!-- Content -->
    <div class="flex-1 overflow-auto p-4 md:p-6">
        <div class="max-w-3xl mx-auto">
            <div
                class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 md:p-8">

                <div class="grid gap-6">
                    <!-- Customer Info -->
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                Nombre del Cliente <span class="text-red-500">*</span>
                            </label>
                            <input type="text" [ngModel]="customerName()" (ngModelChange)="customerName.set($event)"
                                class="w-full px-4 py-3 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-primary focus:border-primary transition-all"
                                placeholder="Ej: Juan Pérez" />
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                Teléfono
                            </label>
                            <input type="tel" [ngModel]="customerPhone()" (ngModelChange)="customerPhone.set($event)"
                                class="w-full px-4 py-3 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-primary focus:border-primary transition-all"
                                placeholder="Ej: 300 123 4567" />
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                            Email
                        </label>
                        <input type="email" [ngModel]="customerEmail()" (ngModelChange)="customerEmail.set($event)"
                            class="w-full px-4 py-3 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-primary focus:border-primary transition-all"
                            placeholder="Ej: cliente@email.com" />
                    </div>

                    <!-- Date & Time -->
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                Fecha <span class="text-red-500">*</span>
                            </label>
                            <input type="date" [ngModel]="date()" (ngModelChange)="date.set($event)"
                                class="w-full px-4 py-3 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-primary focus:border-primary transition-all" />
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                Hora <span class="text-red-500">*</span>
                            </label>
                            <input type="time" [ngModel]="time()" (ngModelChange)="time.set($event)"
                                class="w-full px-4 py-3 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-primary focus:border-primary transition-all" />
                        </div>
                    </div>

                    <!-- Details -->
                    <div class="grid md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                Personas
                            </label>
                            <input type="number" [ngModel]="partySize()" (ngModelChange)="partySize.set($event)" min="1"
                                class="w-full px-4 py-3 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-primary focus:border-primary transition-all" />
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                Duración (min)
                            </label>
                            <input type="number" [ngModel]="duration()" (ngModelChange)="duration.set($event)" step="15"
                                class="w-full px-4 py-3 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-primary focus:border-primary transition-all" />
                        </div>
                        <!-- Table Selection -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                                Mesa (Opcional)
                            </label>
                            <select [ngModel]="selectedTableId()" (ngModelChange)="selectedTableId.set($event)"
                                class="w-full px-4 py-3 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-primary focus:border-primary transition-all">
                                <option value="">Sin Asignar</option>
                                @for (table of tables(); track table.id) {
                                <option [value]="table.id">Mesa {{ table.table_number }} ({{ table.capacity }}p)
                                </option>
                                }
                            </select>
                        </div>
                    </div>

                    <!-- Notes -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                            Notas
                        </label>
                        <textarea [ngModel]="notes()" (ngModelChange)="notes.set($event)" rows="3"
                            class="w-full px-4 py-3 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-primary focus:border-primary transition-all"
                            placeholder="Ej: Aniversario, Alergias..."></textarea>
                    </div>
                </div>

                <!-- Actions -->
                <div class="mt-8 flex justify-end gap-3">
                    <a routerLink="/reservations"
                        class="px-6 py-3 rounded-xl text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 font-bold transition-all">
                        Cancelar
                    </a>
                    <button (click)="saveReservation()" [disabled]="loading()"
                        class="px-8 py-3 bg-primary text-white rounded-xl font-bold hover:bg-primary-dark transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                        @if (loading()) {
                        <span class="material-symbols-outlined animate-spin text-sm">progress_activity</span>
                        <span>Guardando...</span>
                        } @else {
                        <span class="material-symbols-outlined">save</span>
                        <span>Guardar Reserva</span>
                        }
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>
