<div class="h-full">
  <app-dynamic-table
    [data]="products()"
    [columns]="productColumns"
    [actions]="productActions"
    [filters]="productFilters()"
    title="Productos"
    description="Administra el catálogo de platos y bebidas de tu restaurante"
    searchPlaceholder="Buscar productos por nombre, categoría..."
    [showAddButton]="true"
    addButtonLabel="Nuevo Producto"
    (onAdd)="openCreateModal()"
  />

  <!-- Dynamic Modal for Product Form -->
  <app-modal
    [isOpen]="isModalOpen()"
    [title]="selectedProduct() ? 'Editar Producto' : 'Nuevo Producto'"
    (onClose)="closeModal()"
  >
    <app-product-form
      [initialData]="selectedProduct()"
      (onSaved)="onProductSaved()"
      (onCancel)="closeModal()"
    />
  </app-modal>
  <!-- Confirmation Modal for Deletion -->
  <app-confirmation-modal
    [isOpen]="isDeleteModalOpen()"
    title="Eliminar Producto"
    [message]="
      '¿Estás seguro de eliminar el producto ' +
      productToDelete()?.name +
      '? Esta acción no se puede deshacer.'
    "
    confirmLabel="Eliminar Producto"
    (onConfirm)="confirmDelete()"
    (onCancel)="isDeleteModalOpen.set(false)"
  />
</div>
