<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6">
  <!-- Name & Category -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div class="space-y-1.5">
      <label
        class="text-[10px] font-black uppercase tracking-widest text-sage dark:text-sage/40 ml-1"
      >
        Nombre del Producto
      </label>
      <input
        type="text"
        formControlName="name"
        placeholder="Ej: Pizza Artesanal"
        class="w-full px-4 py-3 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/50 text-slate-900 dark:text-white placeholder:text-sage/30 transition-all font-medium"
      />
      @if (productForm.controls.name.invalid && productForm.controls.name.touched) {
        <span class="text-xs text-red-500 italic ml-1">Mínimo 3 caracteres</span>
      }
    </div>

    <div class="space-y-1.5">
      <label
        class="text-[10px] font-black uppercase tracking-widest text-sage dark:text-sage/40 ml-1"
      >
        Categoría
      </label>
      <select
        formControlName="category_id"
        class="w-full px-4 py-3 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/50 text-slate-900 dark:text-white transition-all font-medium appearance-none cursor-pointer"
      >
        <option value="">Seleccionar...</option>
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Price & Prep Time -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div class="space-y-1.5">
      <label
        class="text-[10px] font-black uppercase tracking-widest text-sage dark:text-sage/40 ml-1"
      >
        Precio (COP)
      </label>
      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sage/40 text-sm">$</span>
        <input
          type="number"
          formControlName="price"
          placeholder="0.00"
          class="w-full pl-8 pr-4 py-3 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/50 text-slate-900 dark:text-white transition-all font-mono font-bold"
        />
      </div>
    </div>

    <div class="space-y-1.5">
      <label
        class="text-[10px] font-black uppercase tracking-widest text-sage dark:text-sage/40 ml-1"
      >
        Prep. estimada (min)
      </label>
      <input
        type="number"
        formControlName="preparation_time"
        class="w-full px-4 py-3 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/50 text-slate-900 dark:text-white transition-all font-mono font-bold"
      />
    </div>
  </div>

  <!-- Image URL -->
  <div class="space-y-1.5">
    <label
      class="text-[10px] font-black uppercase tracking-widest text-sage dark:text-sage/40 ml-1"
    >
      URL de Imagen (Opcional)
    </label>
    <div class="flex gap-4">
      <div class="flex-1">
        <input
          type="text"
          formControlName="image_url"
          placeholder="https://..."
          class="w-full px-4 py-3 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/50 text-slate-900 dark:text-white transition-all text-xs font-medium"
        />
      </div>
      @if (productForm.value.image_url) {
        <div
          class="size-12 rounded-xl border border-slate-200 dark:border-white/10 overflow-hidden bg-slate-100"
        >
          <img [src]="productForm.value.image_url" class="w-full h-full object-cover" />
        </div>
      }
    </div>
  </div>

  <!-- Description -->
  <div class="space-y-1.5">
    <label
      class="text-[10px] font-black uppercase tracking-widest text-sage dark:text-sage/40 ml-1"
    >
      Descripción
    </label>
    <textarea
      formControlName="description"
      rows="3"
      placeholder="Detalles del plato..."
      class="w-full px-4 py-3 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/50 text-slate-900 dark:text-white transition-all font-medium resize-none"
    ></textarea>
  </div>

  <!-- Availability Toggle -->
  <div
    class="flex items-center justify-between p-4 bg-slate-50/50 dark:bg-white/5 rounded-2xl border border-slate-100 dark:border-white/5"
  >
    <div class="flex flex-col">
      <span class="text-xs font-bold text-slate-700 dark:text-slate-200">Producto Disponible</span>
      <span class="text-[10px] text-sage">Aparecerá en el menú del cliente</span>
    </div>
    <label class="relative inline-flex items-center cursor-pointer">
      <input type="checkbox" formControlName="is_available" class="sr-only peer" />
      <div
        class="w-11 h-6 bg-slate-200 dark:bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"
      ></div>
    </label>
  </div>

  <!-- Actions -->
  <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-white/5">
    <button
      type="button"
      (click)="cancel()"
      class="flex-1 px-6 py-4 border border-slate-200 dark:border-white/10 text-slate-500 dark:text-sage/60 font-bold rounded-2xl hover:bg-slate-50 dark:hover:bg-white/5 transition-all text-sm"
    >
      Cancelar
    </button>
    <button
      type="submit"
      [disabled]="productForm.invalid || isLoading()"
      class="flex-[2] px-6 py-4 bg-primary hover:bg-primary/90 text-background-dark font-black rounded-2xl transition-all disabled:opacity-30 flex items-center justify-center gap-2 text-sm shadow-xl shadow-primary/20"
    >
      @if (isLoading()) {
        <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
        Guardando...
      } @else {
        <span class="material-symbols-outlined text-[20px]">save</span>
        {{ initialData() ? 'Actualizar Producto' : 'Crear Producto' }}
      }
    </button>
  </div>
</form>
