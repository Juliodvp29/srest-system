<div class="product-image-container relative group">
  <!-- Error Message -->
  @if (errorMessage()) {
    <div
      class="absolute -top-10 left-0 right-0 bg-red-500/10 border border-red-500/20 text-red-500 px-3 py-1.5 rounded-lg text-xs font-bold animate-in fade-in slide-in-from-bottom-2"
    >
      {{ errorMessage() }}
    </div>
  }

  <!-- Upload Area / Preview -->
  <div
    class="relative h-48 w-full rounded-2xl border-2 border-dashed border-slate-200 dark:border-white/10 overflow-hidden bg-slate-50 dark:bg-white/[0.02] flex items-center justify-center transition-all group-hover:border-primary/50"
    [class.border-primary]="isUploading()"
  >
    @if (previewUrl()) {
      <!-- Image Preview -->
      <img [src]="previewUrl()" class="w-full h-full object-cover transition-all" />

      <!-- Delete Overlay -->
      <div
        class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"
      >
        <button
          type="button"
          (click)="removeImage()"
          class="size-12 rounded-full bg-red-500 text-white flex items-center justify-center active:scale-90 transition-transform shadow-xl"
        >
          <span class="material-symbols-outlined text-2xl">delete</span>
        </button>
      </div>
    } @else {
      <!-- Placeholder -->
      <label class="flex flex-col items-center gap-3 cursor-pointer p-8 text-center">
        <div
          class="size-14 rounded-2xl bg-primary/10 text-primary flex items-center justify-center transition-transform group-hover:scale-110"
        >
          <span class="material-symbols-outlined text-3xl">image</span>
        </div>
        <div class="space-y-1">
          <p class="text-xs font-black uppercase tracking-widest text-slate-800 dark:text-white">
            Subir Imagen
          </p>
          <p class="text-[10px] text-sage font-medium">PNG, JPG o WEBP (máx. 5MB)</p>
        </div>
        <input type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)" />
      </label>
    }

    <!-- Loading Overlay -->
    @if (isUploading()) {
      <div
        class="absolute inset-0 bg-white/60 dark:bg-black/60 backdrop-blur-[2px] flex flex-col items-center justify-center gap-3"
      >
        <span class="material-symbols-outlined animate-spin text-3xl text-primary"
          >progress_activity</span
        >
        <span class="text-[10px] font-black uppercase tracking-widest text-primary"
          >Subiendo...</span
        >
      </div>
    }
  </div>
</div>
