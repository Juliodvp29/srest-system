<app-dynamic-table
  [data]="employees()"
  [columns]="columns"
  [actions]="actions"
  [filters]="filters"
  title="Gestión de Empleados"
  description="Administra los accesos y roles de tu equipo de trabajo."
  [showAddButton]="true"
  addButtonLabel="Nuevo Empleado"
  (onAdd)="onAdd.emit()"
/>

<!-- Confirmation Modal for Deletion -->
<app-confirmation-modal
  [isOpen]="isDeleteModalOpen()"
  title="Eliminar Empleado"
  [message]="
    '¿Estás seguro de eliminar a ' +
    employeeToDelete()?.full_name +
    '? Esta acción no se puede deshacer.'
  "
  confirmLabel="Eliminar Empleado"
  (onConfirm)="confirmDelete()"
  (onCancel)="isDeleteModalOpen.set(false)"
/>
