<div class="h-full flex flex-col gap-8">
  <!-- Purchase Registration Card -->
  <div
    class="bg-white dark:bg-background-dark border border-slate-200 dark:border-white/10 rounded-3xl overflow-hidden shadow-sm"
  >
    <div
      class="p-6 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5 flex items-center gap-4"
    >
      <div class="size-12 rounded-2xl bg-primary/10 flex items-center justify-center text-primary">
        <span class="material-symbols-outlined">shopping_cart</span>
      </div>
      <div>
        <h2 class="text-xl font-black text-slate-900 dark:text-white tracking-tight">
          Registrar Compra / Entrada
        </h2>
        <p class="text-sm font-medium text-slate-500 dark:text-sage/40">
          Aumenta el stock disponible de tus insumos
        </p>
      </div>
    </div>

    <div class="p-8">
      <form
        [formGroup]="purchaseForm"
        (ngSubmit)="onSubmit()"
        class="grid grid-cols-1 md:grid-cols-4 gap-6 items-end"
      >
        <!-- Item Selection -->
        <div class="md:col-span-1 space-y-2">
          <label class="text-xs font-black uppercase tracking-widest text-sage/50">Insumo</label>
          <div class="relative">
            <select
              formControlName="inventory_item_id"
              class="w-full px-4 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-medium appearance-none"
            >
              <option value="">Seleccionar...</option>
              @for (item of inventoryItems(); track item.id) {
                <option [value]="item.id">
                  {{ item.name }} ({{ item.current_stock }} {{ item.unit }})
                </option>
              }
            </select>
            <span
              class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-sage/40 pointer-events-none"
              >expand_more</span
            >
          </div>
        </div>

        <!-- Quantity -->
        <div class="md:col-span-1 space-y-2">
          <label class="text-xs font-black uppercase tracking-widest text-sage/50"
            >Cantidad Entrante</label
          >
          <input
            type="number"
            formControlName="quantity"
            class="w-full px-4 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-medium"
            placeholder="Ej: 10"
          />
        </div>

        <!-- Notes -->
        <div class="md:col-span-1 space-y-2">
          <label class="text-xs font-black uppercase tracking-widest text-sage/50"
            >Notas / Comentario</label
          >
          <input
            type="text"
            formControlName="notes"
            class="w-full px-4 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-medium"
            placeholder="Proveedor, factura, etc."
          />
        </div>

        <!-- Action -->
        <button
          type="submit"
          [disabled]="purchaseForm.invalid || isLoading()"
          class="bg-primary hover:shadow-lg hover:shadow-primary/30 text-background-dark h-[60px] rounded-2xl font-black text-sm flex items-center justify-center gap-2 active:scale-95 transition-all disabled:opacity-50"
        >
          <span class="material-symbols-outlined">{{
            isLoading() ? 'sync' : 'add_shopping_cart'
          }}</span>
          {{ isLoading() ? 'Procesando...' : 'Confirmar Entrada' }}
        </button>
      </form>
    </div>
  </div>

  <!-- Recent Activity -->
  <div
    class="flex-1 flex flex-col bg-white dark:bg-background-dark border border-slate-200 dark:border-white/10 rounded-3xl overflow-hidden shadow-sm"
  >
    <div class="p-6 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5">
      <h2 class="text-xl font-black text-slate-900 dark:text-white tracking-tight">
        Entradas Recientes
      </h2>
      <p class="text-sm font-medium text-slate-500 dark:text-sage/40">
        Resumen de las últimas 10 compras registradas
      </p>
    </div>

    <div class="flex-1 overflow-y-auto">
      <app-dynamic-table
        [data]="recentPurchases()"
        [columns]="columns"
        [showAddButton]="false"
        emptyMessage="No se han registrado compras recientemente."
      />
    </div>
  </div>
</div>
