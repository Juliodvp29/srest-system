<div class="h-full">
  <app-dynamic-table
    [data]="displayData()"
    [columns]="columns"
    [actions]="actions"
    [filters]="filters"
    title="Insumos de Inventario"
    description="Gestiona las materias primas y existencias de tu restaurante."
    [showAddButton]="true"
    addButtonLabel="Nuevo Insumo"
    (onAdd)="openCreateModal()"
  />

  <!-- Modal for Item Form -->
  <app-modal
    [isOpen]="isModalOpen()"
    [title]="selectedItem() ? 'Editar Insumo' : 'Nuevo Insumo'"
    (onClose)="closeModal()"
  >
    <app-item-form
      [initialData]="selectedItem()"
      (onSaved)="onItemSaved()"
      (onCancel)="closeModal()"
    />
  </app-modal>
  <!-- Confirmation Modal for Deletion -->
  <app-confirmation-modal
    [isOpen]="isDeleteModalOpen()"
    title="Eliminar Insumo"
    [message]="
      '¿Estás seguro de eliminar el insumo ' +
      itemToDelete()?.name +
      '? Esta acción no se puede deshacer.'
    "
    confirmLabel="Eliminar Insumo"
    (onConfirm)="confirmDelete()"
    (onCancel)="isDeleteModalOpen.set(false)"
  ></app-confirmation-modal>
</div>
