<form [formGroup]="itemForm" (ngSubmit)="onSubmit()" class="space-y-6">
  <!-- Name -->
  <div class="space-y-2">
    <label class="text-xs font-black uppercase tracking-widest text-sage/50"
      >Nombre del Insumo</label
    >
    <div class="relative">
      <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-sage/40"
        >inventory_2</span
      >
      <input
        type="text"
        formControlName="name"
        class="w-full pl-12 pr-4 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-medium"
        placeholder="Ej: Tomate, Harina, Coca-Cola..."
      />
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <!-- Unit -->
    <div class="space-y-2">
      <label class="text-xs font-black uppercase tracking-widest text-sage/50"
        >Unidad de Medida</label
      >
      <div class="relative">
        <select
          formControlName="unit"
          class="w-full px-4 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-medium appearance-none"
        >
          <option value="und">Unidades (und)</option>
          <option value="kg">Kilogramos (kg)</option>
          <option value="gr">Gramos (gr)</option>
          <option value="lt">Litros (lt)</option>
          <option value="ml">Mililitros (ml)</option>
        </select>
        <span
          class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-sage/40 pointer-events-none"
          >expand_more</span
        >
      </div>
    </div>

    <!-- Cost -->
    <div class="space-y-2">
      <label class="text-xs font-black uppercase tracking-widest text-sage/50"
        >Costo Unitario</label
      >
      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sage/40 font-bold">$</span>
        <input
          type="number"
          formControlName="cost_per_unit"
          class="w-full pl-8 pr-4 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-medium"
        />
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <!-- Stock Actual -->
    <div class="space-y-2">
      <label class="text-xs font-black uppercase tracking-widest text-sage/50">Stock Actual</label>
      <input
        type="number"
        formControlName="current_stock"
        class="w-full px-4 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-medium"
      />
    </div>

    <!-- Stock Minimo -->
    <div class="space-y-2">
      <label class="text-xs font-black uppercase tracking-widest text-sage/50">Stock Mínimo</label>
      <input
        type="number"
        formControlName="min_stock"
        class="w-full px-4 py-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-medium"
      />
    </div>
  </div>

  <!-- Actions -->
  <div class="flex gap-3 pt-4">
    <button
      type="button"
      (click)="onCancel.emit()"
      class="flex-1 py-4 px-6 border border-slate-200 dark:border-white/10 rounded-2xl font-bold text-slate-600 dark:text-sage hover:bg-slate-50 dark:hover:bg-white/5 transition-all"
    >
      Cancelar
    </button>
    <button
      type="submit"
      [disabled]="isLoading() || itemForm.invalid"
      class="flex-[2] py-4 px-6 bg-primary text-background-dark rounded-2xl font-bold hover:shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all disabled:opacity-50 disabled:pointer-events-none"
    >
      <span *ngIf="!isLoading()">{{ initialData() ? 'Guardar Cambios' : 'Crear Insumo' }}</span>
      <span *ngIf="isLoading()">Procesando...</span>
    </button>
  </div>
</form>
