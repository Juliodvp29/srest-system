<div class="h-full flex flex-col space-y-4">
  <!-- Header -->
  <div class="flex items-center justify-between flex-shrink-0">
    <div>
      <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Dashboard</h1>
      <p class="text-sm font-medium text-slate-500 dark:text-sage/60">
        Bienvenido, {{ userProfile()?.name || 'Usuario' }}
      </p>
    </div>

    <div
      class="px-3 py-1 bg-slate-100 dark:bg-white/5 rounded-full text-xs font-bold text-slate-500 dark:text-sage uppercase tracking-wider"
    >
      {{ role() }}
    </div>
  </div>

  <!-- Admin/Manager View -->
  @if (isManager()) {
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 flex-1 overflow-hidden"
      style="grid-template-rows: minmax(180px, 1fr) minmax(300px, 2fr)"
    >
      <!-- Top Row -->
      <div class="col-span-1 flex flex-col min-h-0">
        <app-sales-summary class="h-full" />
      </div>
      <div class="col-span-1 md:col-span-2 flex flex-col min-h-0">
        <app-daily-stats class="h-full" />
      </div>

      <!-- Big Active Orders Column (Spans 2 rows) -->
      <div class="col-span-1 md:col-span-1 lg:row-span-2 flex flex-col min-h-0">
        <app-active-orders class="h-full" />
      </div>

      <!-- Bottom Row -->
      <div class="col-span-1 md:col-span-3 lg:col-span-3 flex flex-col min-h-0">
        <app-low-stock-alert class="h-full" />
      </div>
    </div>
  }

  <!-- Waiter View -->
  @else if (isWaiter()) {
    <div class="h-[calc(100%-80px)]">
      <app-active-orders />
    </div>
  }

  <!-- Chef View -->
  @else if (isChef()) {
    <div class="h-[calc(100%-80px)]">
      <app-active-orders />
    </div>
  }

  <!-- Cashier View -->
  @else if (isCashier()) {
    <div class="h-[calc(100%-80px)] grid grid-cols-1 lg:grid-cols-2 gap-6">
      <app-active-orders />
      <app-sales-summary />
    </div>
  }
</div>
