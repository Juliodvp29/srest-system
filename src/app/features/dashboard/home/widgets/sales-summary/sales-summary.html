<div
  class="h-full flex flex-col bg-white dark:bg-background-dark border border-slate-200 dark:border-white/10 rounded-3xl overflow-hidden shadow-sm p-5 relative group"
>
  <!-- Decoration -->
  <div
    class="absolute -right-6 -top-6 size-32 bg-primary/10 rounded-full blur-2xl group-hover:bg-primary/20 transition-all"
  ></div>

  <div class="flex items-center justify-between mb-3 relative z-10">
    <div class="size-12 rounded-2xl bg-primary/10 flex items-center justify-center text-primary">
      <span class="material-symbols-outlined">payments</span>
    </div>
    <span
      class="text-xs font-black uppercase tracking-widest text-slate-400 bg-slate-100 dark:bg-white/5 px-3 py-1 rounded-full"
      >Hoy</span
    >
  </div>

  <div class="relative z-10 flex-1 flex flex-col justify-center">
    <p class="text-sm font-medium text-slate-500 dark:text-sage/60 mb-1">Ventas Totales</p>
    <h3 class="text-3xl font-black text-slate-900 dark:text-white tracking-tighter mb-3">
      {{ stats().totalSales | currency }}
    </h3>

    <div class="flex items-center gap-2 text-sm font-medium text-slate-500 dark:text-sage/60">
      <span
        class="flex items-center justify-center size-6 bg-green-100 dark:bg-green-500/20 text-green-600 rounded-full text-xs"
      >
        <span class="material-symbols-outlined text-[14px]">checklist</span>
      </span>
      <span>{{ stats().orderCount }} pedidos completados</span>
    </div>
  </div>
</div>
