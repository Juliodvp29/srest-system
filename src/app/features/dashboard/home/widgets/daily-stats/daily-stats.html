<div class="grid grid-cols-2 gap-4 h-full">
  <!-- Avg Ticket -->
  <div
    class="bg-white dark:bg-background-dark border border-slate-200 dark:border-white/10 rounded-3xl p-5 flex flex-col justify-between shadow-sm relative overflow-hidden group"
  >
    <div
      class="absolute -right-6 -top-6 size-24 bg-blue-100 dark:bg-blue-500/10 rounded-full blur-2xl group-hover:bg-blue-200 dark:group-hover:bg-blue-500/20 transition-all"
    ></div>

    <div class="relative z-10">
      <div
        class="size-10 rounded-xl bg-blue-100 dark:bg-blue-500/10 flex items-center justify-center text-blue-600 mb-2"
      >
        <span class="material-symbols-outlined">receipt_long</span>
      </div>
      <p class="text-xs font-bold text-slate-500 dark:text-sage/60 uppercase tracking-wide">
        Ticket Promedio
      </p>
      <h3 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight mt-1">
        {{ stats().avgTicket | currency }}
      </h3>
    </div>
  </div>

  <!-- Occupancy -->
  <div
    class="bg-white dark:bg-background-dark border border-slate-200 dark:border-white/10 rounded-3xl p-5 flex flex-col justify-between shadow-sm relative overflow-hidden group"
  >
    <div
      class="absolute -right-6 -top-6 size-24 bg-amber-100 dark:bg-amber-500/10 rounded-full blur-2xl group-hover:bg-amber-200 dark:group-hover:bg-amber-500/20 transition-all"
    ></div>

    <div class="relative z-10">
      <div
        class="size-10 rounded-xl bg-amber-100 dark:bg-amber-500/10 flex items-center justify-center text-amber-600 mb-2"
      >
        <span class="material-symbols-outlined">chair_alt</span>
      </div>
      <p class="text-xs font-bold text-slate-500 dark:text-sage/60 uppercase tracking-wide">
        Ocupación
      </p>
      <div class="flex items-end gap-2 mt-1">
        <h3 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">
          {{ stats().occupancyRate | percent }}
        </h3>
        <span class="text-xs font-medium text-slate-400 mb-1.5">
          {{ stats().occupiedTables }}/{{ stats().totalTables }}
        </span>
      </div>
    </div>
  </div>
</div>
