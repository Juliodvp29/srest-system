<!-- Global Alert Container -->
<div
  class="fixed top-6 left-1/2 -translate-x-1/2 sm:left-auto sm:right-6 sm:translate-x-0 z-[10000] flex flex-col gap-4 w-[calc(100%-3rem)] max-w-sm pointer-events-none"
>
  @for (alert of alertService.alerts(); track alert.id) {
    <div class="pointer-events-auto shadow-2xl animate-in fade-in zoom-in duration-300">
      <app-alert [alert]="alert" />
    </div>
  }
</div>
