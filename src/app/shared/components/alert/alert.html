<div
  class="alert-item group flex items-start gap-4 p-4 rounded-2xl border transition-all animate-in fade-in slide-in-from-right-8 duration-300"
  [ngClass]="{
    'alert-success': alert().type === 'success',
    'alert-error': alert().type === 'error',
    'alert-warning': alert().type === 'warning',
    'alert-info': alert().type === 'info',
  }"
>
  <!-- Icon container -->
  <div class="icon-container size-12 rounded-full flex items-center justify-center shrink-0">
    <span class="material-symbols-outlined text-2xl font-bold">
      {{ getIcon() }}
    </span>
  </div>

  <!-- Content -->
  <div class="flex-1 space-y-1 pt-1">
    <h4 class="text-sm font-black tracking-tight uppercase">
      {{ alert().title }}
    </h4>
    <p class="text-xs font-medium leading-relaxed opacity-80">
      {{ alert().message }}
    </p>
  </div>

  <!-- Close Button -->
  <button
    (click)="close()"
    class="size-8 rounded-lg flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/5 transition-colors"
  >
    <span class="material-symbols-outlined text-lg opacity-40 group-hover:opacity-100">close</span>
  </button>
</div>
