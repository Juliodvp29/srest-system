@if (isOpen()) {
  <div
    class="backdrop fixed inset-0 z-[100] flex items-center justify-center p-4 backdrop-blur-sm bg-background-dark/40 transition-opacity duration-300"
    (click)="onBackdropClick($event)"
  >
    <div
      class="modal-card w-full max-w-lg bg-background-light dark:bg-background-dark border border-slate-200 dark:border-white/5 shadow-2xl rounded-3xl overflow-hidden animate-in fade-in zoom-in-95 duration-200 flex flex-col"
    >
      <!-- Modal Header -->
      <div
        class="px-6 py-5 flex items-center justify-between border-b border-slate-100 dark:border-white/5"
      >
        <h3 class="text-lg font-black uppercase tracking-tight text-slate-900 dark:text-white">
          {{ title() }}
        </h3>
        <button
          (click)="close()"
          class="size-10 flex items-center justify-center rounded-xl hover:bg-slate-100 dark:hover:bg-white/5 text-slate-400 hover:text-primary transition-all active:scale-90"
        >
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 md:p-8 overflow-y-auto max-h-[80vh] custom-scrollbar">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
